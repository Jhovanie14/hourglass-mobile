<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        display: grid;
        grid-template-rows: 1fr auto;
        height: 100vh;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-top: 1px solid #e5e7eb;
      }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: #111827;
        color: #fff;
        cursor: pointer;
      }
      #mic-status {
        font-size: 14px;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <iframe
        id="panel"
        src="http://localhost:3000/panel?mode=remote"
        allow="microphone; autoplay"
      ></iframe>
      <div class="bar">
        <button id="enable-mic">Enable microphone</button>
        <span id="mic-status">Step 2: click to grant microphone access.</span>
      </div>
    </div>
    <script src="setup.js"></script>
  </body>
</html>
